name: Windows Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 25
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Determine version
        id: version
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { 'v0.0.0-preview' }
          if ($version -notmatch '^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(-[0-9A-Za-z]+(?:[.-][0-9A-Za-z]+)*)?$') {
            throw 'Version tags must use v1.2.3 or v1.2.3-beta.1 format.'
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "prerelease=$($version.Contains('-').ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Install matching Wails CLI
        run: |
          $wailsVersion = go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2
          if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve the Wails version from go.mod.' }
          go install "github.com/wailsapp/wails/v2/cmd/wails@$wailsVersion"
          if ($LASTEXITCODE -ne 0) { throw 'Wails installation failed.' }

      - name: Test and build Windows release
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/build-release.ps1 -Version $env:RELEASE_VERSION

      - name: Preserve release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: project-runner-windows-x64
          path: |
            build/bin/release/ProjectRunner.exe
            build/bin/release/SHA256SUMS.txt
            build/bin/release/release-notes.md
          if-no-files-found: error
          retention-days: 14

  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: project-runner-windows-x64
          path: release

      - name: Verify uploaded executable
        working-directory: release
        run: sha256sum --check SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          RELEASE_PRERELEASE: ${{ needs.build.outputs.prerelease }}
        shell: bash
        run: |
          options=()
          if [[ "$RELEASE_PRERELEASE" == 'true' ]]; then
            options+=(--prerelease --latest=false)
          fi
          gh release create "$RELEASE_VERSION" \
            release/ProjectRunner.exe release/SHA256SUMS.txt \
            --verify-tag --title "ProjectRunner $RELEASE_VERSION" \
            --generate-notes --notes-file release/release-notes.md \
            "${options[@]}"
